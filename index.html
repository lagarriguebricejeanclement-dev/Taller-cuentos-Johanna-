<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Todos somos parte del cuento</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cuento">
<meta name="theme-color" content="#FFF6E8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* Layout: one-screen game board — progress bar, phase title, how-to-play rule, animal row, bottom action bar */
:root{
  --cream:#FFF6E8; --paper:#FFFDF8; --ink:#221C1A; --ink-soft:#4A403B; --line:#E9DCC6;
  --f:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--f);font-size:20px;line-height:1.4;font-weight:700;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
html,body,.app{touch-action:manipulation}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.top{padding-block:14px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:6px;flex:1}
.dot{height:10px;flex:1;border-radius:6px;background:var(--line);transition:background .3s}
.dot.on{background:var(--ink)}
.count{font-size:17px;white-space:nowrap}
.stage{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:8px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.phase{min-height:100%;display:flex;flex-direction:column;gap:18px;animation:enter .38s cubic-bezier(.2,.9,.3,1.2)}
@keyframes enter{from{opacity:0;transform:translateY(18px)}}
.ptitle{font-weight:800;font-size:34px;line-height:1.1;margin:0;text-wrap:balance}
.rule{font-size:23px;line-height:1.35;margin:0}
.lema{margin:4px 4px 0;font-weight:800;font-size:44px;line-height:1.05;text-wrap:balance;padding:22px 20px 24px;background:var(--paper);border:3px solid var(--ink);border-radius:22px 30px 18px 26px;box-shadow:0 6px 0 var(--ink);transform:rotate(-1.5deg)}
.row{display:flex;gap:8px;justify-content:center}
.row.bottom{margin-top:auto}
.h{width:19%;max-width:88px;aspect-ratio:1;display:flex}
.h svg{width:100%;height:100%;display:block}
.h:nth-child(odd){transform:rotate(-5deg)} .h:nth-child(even){transform:rotate(5deg)}
.bar{display:flex;gap:12px;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:3px solid var(--ink);background:var(--cream)}
.big-btn{flex:1;min-height:64px;padding:12px 26px;border-radius:999px;background:var(--ink);color:var(--cream);font-weight:800;font-size:24px;box-shadow:0 5px 0 rgba(34,28,26,.35)}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(34,28,26,.35)}
.alt-btn{flex:none;min-height:64px;padding:10px 22px;border-radius:999px;background:var(--paper);border:3px solid var(--ink);font-weight:800;font-size:21px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{animation:stepin .45s cubic-bezier(.2,.9,.3,1.2);counter-increment:s;display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:12px;row-gap:12px;align-items:start;font-size:22px;line-height:1.3}
.steps li>.x{grid-column:1/-1}
.steps li::before{content:counter(s);width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
@keyframes stepin{from{opacity:0;transform:translateY(14px)}}
.table{position:relative;height:300px;border-radius:24px;background:var(--paper);border:3px solid var(--ink);overflow:hidden}
.dc{position:absolute;left:50%;top:50%;width:88px;height:124px;margin:-62px 0 0 -44px;perspective:700px;transition:transform .2s cubic-bezier(.3,.8,.4,1.3),opacity .3s}
.dc .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.3,1.15)}
.dc.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;border:3px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center}
.back{background:repeating-linear-gradient(45deg,#E69F00 0 12px,#56B4E9 12px 24px,#CC79A7 24px 36px,#009E73 36px 48px,#0072B2 48px 60px)}
.back::after{content:"";width:46%;aspect-ratio:1;border-radius:50%;background:var(--cream);border:3px solid var(--ink)}
.front{background:var(--cream);transform:rotateY(180deg);padding:8px;font-weight:800;font-size:10px;line-height:1.15}
.dc.win{z-index:5}
.box{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:16px 18px;font-size:21px;line-height:1.4}
.big-btn[disabled]{opacity:.35;box-shadow:none;cursor:default}
.clist{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.card{width:calc(50% - 8px);max-width:170px;aspect-ratio:1;padding:0;border-radius:13%;overflow:hidden;box-shadow:0 6px 0 var(--ink);transition:transform .12s}
.card svg{width:100%;height:100%;display:block}
.card:nth-child(odd){transform:rotate(-2deg)}.card:nth-child(even){transform:rotate(2deg)}
.card:active{transform:translateY(3px) scale(.97);box-shadow:0 2px 0 var(--ink)}
.ct{display:block;width:78px;aspect-ratio:1}
.ct svg{width:100%;height:100%;display:block}
.cl{font-size:44px;font-weight:900;line-height:1}
.cn{font-size:21px;line-height:1.15;font-weight:800}
.wide{width:100%}
.ov{position:fixed;inset:0;z-index:20;background:rgba(34,28,26,.55);display:flex;align-items:center;justify-content:center;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.ov{perspective:1200px}
.cardflip{width:100%;max-width:440px;max-height:100%;display:grid;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.3,1.15);animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.6)}}
.cardflip.on{transform:rotateY(180deg)}
.fc{grid-area:1/1;border:4px solid var(--ink);border-radius:26px;padding:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:calc(100vh - 40px)}
.ff{align-items:center;justify-content:center;text-align:center}
.fb{transform:rotateY(180deg)}
.ct.big{width:min(70vw,260px)}
.huge{font-size:80px}
.fhead{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;gap:10px}
.fhead .ct{width:64px}
.qs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.qs li{font-size:23px;line-height:1.3;padding:12px 14px;border-radius:14px;background:var(--paper);color:var(--ink);border:3px solid var(--ink)}
.fc .alt-btn{color:var(--ink)}
.sheet{width:100%;max-width:440px;max-height:100%;overflow-y:auto;background:var(--cream);border:4px solid var(--ink);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px;animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
.box.time{display:flex;justify-content:space-between;align-items:baseline;font-size:24px}
.box.time b{font-size:40px;font-variant-numeric:tabular-nums}
.times{width:100%;border-collapse:collapse;font-size:19px}
.times td{padding:8px 4px;border-bottom:2px solid var(--line)}
.times td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.p0{gap:14px}
.p0 .rule{font-size:21px;line-height:1.3}
.p0 .lema{font-size:36px;padding:16px 18px 18px;margin-top:0}
.wip{margin:0;padding:14px;border:3px dashed var(--ink-soft);border-radius:16px;color:var(--ink-soft);font-size:17px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="dots" id="dots"></div><div class="count" id="count"></div></div>
  <main class="stage" id="stage"></main>
  <nav class="bar" id="bar"></nav>
</div>
<div id="overlay"></div>

const TILES=SVGS.map(x=>`<span class="h">${x}</span>`).join("");
const PHASES=[
 {t:"Bienvenida y acuerdos",r:"Hoy vamos a crear cuentos juntos. Cada persona participa como quiera: con palabras, dibujos, gestos o actuando. Si no quieres, puedes pasar, sin explicar por qué."},

 {t:"Cierre y evaluación",steps:["Terminamos el juego. Cada persona responde en voz alta, o pasa.","¿Qué aporté yo al cuento?","¿Qué cambió en nuestro cuento?","¿Cómo me sentí participando?"]}

const SCN=[
 {r:"La Princesa y el Sapo: El Hechizo Inesperado",s:"Estamos en una fiesta de disfraces. De momento, aparece un sapo muy llamativo, por sus colores y forma. Alguien lo toca… y, de repente, todas las personas del grupo nos convertimos en sapos. La fiesta está a punto de terminar y el hechizo no se rompe con un beso. ¿Qué hacemos para volver a nuestra forma —o decidir juntos qué forma queremos tener—?"},
 {r:"Hansel y Gretel: La Casa de Dulces",s:"En medio del bosque encontramos una casa hecha de dulces. Al acercarnos, oímos a alguien pedir ayuda desde dentro, pero también vemos que la puerta tiene un candado mágico. ¿Cómo averiguamos qué ocurre y cómo ayudamos sin poner a nadie en peligro?"},
 {r:"Rapunzel: La Torre sin puertas",s:"Llegamos a una torre muy alta. Desde arriba alguien deja caer una larga cuerda hecha de trenzas y pide ayuda para bajar, pero la cuerda no alcanza el suelo. No hay puerta y se acerca una tormenta. ¿Qué podemos hacer para comunicarnos, ayudar y encontrar una salida segura?"},
 {r:"Blancanieves: La Manzana Misteriosa",s:"En una celebración aparece una cesta de manzanas brillantes. Una de ellas hace que quien la muerde caiga en un sueño profundo. Ahora, una persona del grupo se ha dormido y las demás no saben cuál manzana está hechizada. ¿Cómo averiguamos qué ha pasado y qué hacemos para despertar a nuestra compañera o compañero?"},
 {r:"El Flautista de Hamelín: La música que se lleva los Pasos",s:"En el pueblo empieza a sonar una melodía que hace que los pies de todo el mundo caminen solos hacia un lugar desconocido. Nadie puede dejar de seguir el ritmo. ¿Cómo conseguimos escucharnos, movernos de otra manera, averiguar para dónde van las personas y descubrir cómo pararlos?"},
 {r:"El Gato con Botas: El Baúl Equivocado",s:"En el camino hacia el castillo, encontramos un baúl con una corona dentro. Al abrirlo, aparece un mapa que cambia cada vez que alguien lo mira. El gato dice que solo se puede llegar al castillo si todas las personas del grupo aportan una pista. ¿Qué pistas imaginamos y cómo decidimos hacia dónde ir?"}
];
const CARDS=[
 {l:"A",n:"Protagonista: yo en la historia",bg:"#E69F00",fg:"#221C1A",q:["¿Cómo te describes o cómo quieres aparecer?","¿Qué te gustaría poder hacer?"]},
 {l:"B",n:"Lugar",bg:"#56B4E9",fg:"#221C1A",q:["¿Dónde estás?","¿Qué hay allí?","¿Cómo se siente ese lugar?"]},
 {l:"C",n:"Pensamientos y emociones",bg:"#CC79A7",fg:"#221C1A",q:["¿Qué piensas?","¿Qué sientes ante el problema?"]},
 {l:"D",n:"Acción y colaboración",bg:"#009E73",fg:"#221C1A",q:["¿Qué haces?","¿Hay alguien más contigo?","¿Cómo deciden o lo resuelven juntos?"]},
 {l:"E",n:"Final",bg:"#0072B2",fg:"#FFFFFF",q:["¿Qué ocurre al final?","¿Qué frase, imagen o actuación representa ese final?"]}
];
const CONSIGNA="En esta historia estamos quienes participamos en el taller. Cada persona puede decidir qué hace, qué piensa, qué dice o qué propone. Puedes escribir, dibujar, dictar, narrar, representar o pasar turno.";
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let current=null, drawing=false, played=[];
let order=[0,1,2,3,4].sort(()=>Math.random()-.5);
/* Hidden stopwatch: starts on the button of screen 1, kept in memory only, shown at the very end. Nothing is saved or sent. */
let phase=0, startedAt=null, enteredAt=null, shown=1;
const spent=[0,0,0,0,0,0];
const fmt=ms=>{const t=Math.round(ms/1000),m=Math.floor(t/60),x=t%60;return `${m}:${String(x).padStart(2,"0")}`;};
const $=id=>document.getElementById(id);
function leave(){ if(startedAt!==null&&phase<6){ spent[phase]+=Date.now()-enteredAt; } }
function go(n){ const back=n<phase; leave(); phase=n; enteredAt=Date.now(); const st=n<6?PHASES[n].steps:null; shown=st?((back||PHASES[n].all)?st.length:1):0; render(); }
function extra(i){
  if(phase===3&&i===2) return `<div class="x clist">${order.map(k=>`<button class="card" data-card="${k}" aria-label="Tarjeta">${SVGS[k]}</button>`).join("")}</div><button class="x alt-btn wide" id="scnBtn">Ver el problema</button>`;
  if(phase!==2) return "";
  if(i===0) return `<div class="x table" id="table"></div>`;
  if(i===1) return `<div class="x box">${SCN[current].s}</div>`;
  if(i===2) return `<div class="x box">${CONSIGNA}</div>`;
  return "";
}
function stepHTML(i){ return `<li><span>${PHASES[phase].steps[i]}</span>${extra(i)}</li>`; }
function setupTable(){
  const t=$("table"); if(!t) return;
  t.innerHTML=SCN.map(x=>`<div class="dc"><div class="in"><div class="face back"></div><div class="face front">${x.r}</div></div></div>`).join("");
  const sx=Math.min(110,(t.clientWidth-100)/2), cards=[...t.children];
  t._slots=[[-sx,-66],[0,-66],[sx,-66],[-sx,66],[0,66],[sx,66]];
  cards.forEach((c,i)=>{
    if(current!==null){ if(i===current){c.classList.add("win","flip");c.style.transform="scale(1.9)"} else c.style.opacity="0"; }
    else c.style.transform=`translate(${t._slots[i][0]}px,${t._slots[i][1]}px)`;
  });
}
function draw(){
  if(drawing) return; drawing=true; $("next").disabled=true;
  let pool=SCN.map((_,i)=>i).filter(i=>!played.includes(i));
  if(!pool.length){played=[];pool=SCN.map((_,i)=>i)}
  current=pool[Math.floor(Math.random()*pool.length)]; played.push(current);
  const t=$("table"), cards=[...t.children], SL=t._slots;
  let round=0; const rounds=reduce?0:7;
  const tick=()=>{
    if(round<rounds){
      const perm=[0,1,2,3,4,5].sort(()=>Math.random()-.5);
      cards.forEach((c,i)=>{const [x,y]=SL[perm[i]];c.style.transform=`translate(${x+(round%2?8:-8)}px,${y}px) rotate(${Math.round(Math.random()*24-12)}deg)`});
      round++; setTimeout(tick,210);
    } else {
      cards.forEach((c,i)=>{if(i===current){c.classList.add("win");c.style.transition="transform .45s cubic-bezier(.3,.8,.4,1.2)";c.style.transform="scale(1.9)"}else c.style.opacity="0"});
      setTimeout(()=>cards[current].classList.add("flip"),reduce?0:420);
      setTimeout(()=>{drawing=false;const n=$("next");n.disabled=false;n.textContent="Siguiente"},reduce?0:1050);
    }
  };
  tick();
}
function scnHTML(){ const x=SCN[current]; return `<div class="box"><b>${x.r}</b></div><div class="box">${x.s}</div><div class="box">${CONSIGNA}</div>`; }
function overlay(html){
  $("overlay").innerHTML=`<div class="ov" id="ov">${html}</div>`;
  $("ov").onclick=e=>{ if(e.target.id==="ov") closeOv(); };
  $("closeBtn").onclick=closeOv; $("closeBtn").focus({preventScroll:true});
}
function closeOv(){ $("overlay").innerHTML=""; }
function openCard(k){
  const c=CARDS[k];
  overlay(`<div class="cardflip" id="flip" role="dialog" aria-label="${c.n}"><div class="fc ff" style="background:${c.bg};color:${c.fg}"><span class="ct big">${SVGS[k]}</span></div><div class="fc fb" style="background:${c.bg};color:${c.fg}"><div class="fhead"><span class="ct">${SVGS[k]}</span><span class="cn">${c.n}</span></div><ul class="qs">${c.q.map(q=>`<li>${q}</li>`).join("")}</ul><button class="alt-btn wide" id="closeBtn">Cerrar</button></div></div>`);
  setTimeout(()=>{ const f=$("flip"); f&&f.classList.add("on"); },reduce?0:420);
}
function openScn(){ overlay(`<div class="sheet" role="dialog" aria-label="El problema">${scnHTML()}<button class="alt-btn wide" id="closeBtn">Cerrar</button></div>`); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeOv(); });
function renderEnd(){
  $("dots").innerHTML=PHASES.map(()=>`<span class="dot on"></span>`).join("");
  $("count").textContent="Fin";
  const total=spent.reduce((a,b)=>a+b,0);
  const rows=PHASES.map((p,i)=>i===0?"":`<tr><td>${p.t}</td><td>${fmt(spent[i])}</td></tr>`).join("");
  $("stage").innerHTML=`<section class="phase"><p class="lema">Todos somos parte del cuento.</p><div class="row">${TILES}</div><div class="box time"><span>Tiempo total</span><b>${fmt(total)}</b></div><table class="times"><tbody>${rows}</tbody></table></section>`;
  $("stage").scrollTop=0;
  $("bar").innerHTML=`<button class="big-btn" id="again">Otra vez</button>`;
  $("again").onclick=()=>{ phase=0; startedAt=null; enteredAt=null; spent.fill(0); current=null; order=[0,1,2,3,4].sort(()=>Math.random()-.5); shown=1; render(); };
}
function render(){
  if(phase===6) return renderEnd();
  $("dots").innerHTML=PHASES.map((_,i)=>`<span class="dot${i<=phase?" on":""}"></span>`).join("");
  $("count").textContent=`Fase ${phase+1} de 6`;
  const p=PHASES[phase];
  let h=`<h1 class="ptitle">${p.t}</h1>`+(p.steps?`<ol class="steps" id="steps">${p.steps.slice(0,shown).map((x,i)=>stepHTML(i)).join("")}</ol>`:`<p class="rule">${p.r}</p>`);
  if(phase===0) h+=`<p class="lema">Todos somos parte del cuento.</p><div class="row">${TILES}</div>`;
  else if(phase===1) h+=`<div class="row bottom">${TILES}</div>`;
  else if(phase===2||phase===3) {}
  else if(phase===4) h+=`<div class="row bottom">${TILES}</div>`;
  $("stage").innerHTML=`<section class="phase${phase===0?" p0":""}">${h}</section>`;
  $("stage").scrollTop=0;
  let b="";
  if(phase>0) b+=`<button class="alt-btn" id="back">Atrás</button>`;
  const label=phase===0?"Empezar":(phase===2&&current===null?"Sortear":"Siguiente");
  b+=`<button class="big-btn" id="next">${label}</button>`;
  $("bar").innerHTML=b;
  $("back")&&($("back").onclick=()=>{ if(!drawing) go(phase-1); });
  if(phase===2) setupTable();
  $("stage").onclick=e=>{ const c=e.target.closest("[data-card]"); if(c) openCard(+c.dataset.card); if(e.target.closest("#scnBtn")) openScn(); };
  $("next").onclick=()=>{
    if(phase===0&&startedAt===null){ startedAt=Date.now(); enteredAt=startedAt; }
    if(drawing) return;
    if(phase===2&&current===null){ draw(); return; }
    const st=PHASES[phase].steps;
    if(st&&shown<st.length){ shown++; $("steps").insertAdjacentHTML("beforeend",stepHTML(shown-1)); $("steps").lastElementChild.scrollIntoView({block:"start",behavior:reduce?"auto":"smooth"}); return; }

  };
